[project]
name = "raspberrypi-bird-toilet-cleaning"
version = "1.3.1"
description = "🐦 라즈베리파이 기반 새장 화장실 자동 청소 시스템"
readme = "README.md"
authors = [
    {name = "Toilet Cleaning System Team"}
]
license = {text = "MIT"}
requires-python = ">=3.9"

# 핵심 의존성
dependencies = [
    # 시리얼 통신
    "pyserial>=3.5",
    
    # 컴퓨터 비전 및 이미지 처리
    "opencv-python>=4.8.0",
    "numpy>=1.21.0",
    "pillow>=8.3.0",
    
    # YOLO 객체 탐지
    "ultralytics>=8.0.0",
    
    # 딥러닝 프레임워크 (YOLO 의존성)
    "torch>=1.9.0",
    "torchvision>=0.10.0",
    
    # 유틸리티
    "matplotlib>=3.3.0",
    "pyyaml>=5.4.0",
    "psutil>=5.8.0",
    
    # 시스템 모니터링
    "requests>=2.25.0",
]

# 개발 도구 (선택사항)
[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "black>=21.0",
    "isort>=5.0",
    "flake8>=3.8",
    "mypy>=0.800",
]

# 라즈베리파이 특화 의존성 (시스템 패키지 필요)
rpi = [
    # 이 패키지들은 시스템 레벨에서 설치 필요
    # sudo apt install python3-picamera2 libcamera-apps
    # "picamera2",  # 시스템 패키지로만 설치 가능
    # "RPi.GPIO",   # 시스템 패키지로만 설치 가능
]

# 테스트용 의존성
test = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "pytest-mock>=3.0",
]

[project.scripts]
# 실행 명령어 등록
toilet-clean = "main:main"
clean-system = "clean_ver.run_system:main"
pi-camera = "Reserve.pi_camera_client:main"

[project.urls]
Homepage = "https://github.com/yourname/toilet-cleaning-system"
Repository = "https://github.com/yourname/toilet-cleaning-system.git"
Issues = "https://github.com/yourname/toilet-cleaning-system/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "clean_ver",
    "Reserve",
]

# uv 설정
[tool.uv]
dev-dependencies = [
    "pytest>=6.0",
    "black>=21.0",
    "isort>=5.0",
]

# Python 버전 관리
[tool.uv.sources]
# 로컬 개발시 편집 가능한 설치
# 예: some-package = { path = "../some-package", editable = true }

# Black 코드 포매터 설정
[tool.black]
line-length = 88
target-version = ['py39']
include = '\.pyi?$'
extend-exclude = '''
/(
  # 제외할 디렉토리나 파일
  \.eggs
  | \.git
  | \.venv
  | build
  | dist
)/
'''

# isort import 정렬 설정
[tool.isort]
profile = "black"
multi_line_output = 3
line_length = 88

# pytest 설정
[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers"
testpaths = [
    "tests",
]
python_files = [
    "test_*.py",
    "*_test.py",
]

# mypy 타입 체크 설정
[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

# 라즈베리파이 특화 설정
[tool.rpi-config]
# 시스템 패키지 설치 필요 목록
system-packages = [
    "python3-picamera2",
    "libcamera-apps", 
    "python3-rpi.gpio",
    "v4l-utils",  # 카메라 유틸리티
]

# 권한 설정 필요 그룹
required-groups = [
    "video",    # 카메라 접근
    "dialout",  # 시리얼 포트 접근
    "gpio",     # GPIO 접근 (선택사항)
] 